<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Problem Solving Platform</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">💡 Problem Solver</a>
            <ul class="navbar-menu">
                <li><a href="/">Home</a></li>
                <li><button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-3">Login to Your Account</h2>

            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="error-message" class="form-error" style="display: none;"></div>

                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
            </form>

            <p class="text-center mt-2">
                Don't have an account? <a href="/signup" style="color: var(--primary-color);">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = '/';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            hideError('error-message');

            try {
                const response = await apiCall('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                // Save token and user info
                setToken(response.data.token);
                setUser(response.data);

                // Redirect to home
                window.location.href = '/';
            } catch (error) {
                showError('error-message', error.message || 'Login failed. Please try again.');
            }
        });
    </script>
</body>
</html>
